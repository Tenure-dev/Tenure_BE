spring:
  application:
    name: tenure-be

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/Tenure_DB}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: trueaㅝ
    show-sql: false

  sql:
    init:
      platform: postgresql

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB


logging:
  level:
    com.tenure: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  email-verification-enabled: ${APP_EMAIL_VERIFICATION_ENABLED:true}

tenure:
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      base-dir: ${STORAGE_BASE_DIR:./uploads}
      base-url: ${STORAGE_BASE_URL:/files}
    r2:
      bucket: ${R2_BUCKET:}
      endpoint: ${R2_ENDPOINT:}
      public-base-url: ${R2_PUBLIC_BASE_URL:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  trade:
    auto-confirm:
      interval-minutes: 10
      confirm-hours: 72
  ootd:
    hot-score:
      interval-minutes: 10
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      endpoint: ${GEMINI_API_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
      model: ${GEMINI_MODEL:gemini-flash-lite-latest}
    tag:
      confidence-threshold: ${AI_TAG_CONFIDENCE_THRESHOLD:0.6}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-in-seconds: 3600

encryption:
  secret: ${ENCRYPTION_SECRET:tenure-local-aes-secret-key-32b!}

resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:noreply@tenure.co.kr}
